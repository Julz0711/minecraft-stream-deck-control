<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Minecraft Control</title>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body>
		<div class="item">
			<label for="command">Command</label>
			<input type="text" id="command" data-setting="command" placeholder="/home" spellcheck="false" />
		</div>
		<div class="item">
			<label for="label">Key label</label>
			<input type="text" id="label" data-setting="label" placeholder="Shown on the key" />
		</div>
		<div class="item">
			<label for="confirm">Confirm</label>
			<input type="checkbox" id="confirm" data-setting="confirm" />
			<span>Press twice to run</span>
		</div>
		<p class="hint">Chat command keys are off until you turn them on in the Stream Deck Control settings in Minecraft (Mod Menu).</p>
		<script src="pi.js"></script>
	</body>
</html>
