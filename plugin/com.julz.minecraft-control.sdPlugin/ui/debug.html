<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Minecraft Control</title>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body>
		<div class="item">
			<label for="key">Shortcut</label>
			<select id="key" data-setting="key" data-default="chunk_borders">
				<option value="chunk_borders">Chunk borders (F3+G)</option>
				<option value="hitboxes">Hitboxes (F3+B)</option>
				<option value="advanced_tooltips">Advanced tooltips (F3+H)</option>
				<option value="reload_chunks">Reload chunks (F3+A)</option>
				<option value="reload_resources">Reload resource packs (F3+T)</option>
				<option value="copy_location">Copy location (F3+C)</option>
				<option value="pause_on_lost_focus">Pause when tabbed out (F3+P)</option>
			</select>
		</div>
		<p class="hint">Some servers hide debug info; then chunk borders, hitboxes and copy location are locked, like in vanilla.</p>
		<script src="pi.js"></script>
	</body>
</html>
