<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Minecraft Control</title>
		<link rel="stylesheet" href="pi.css" />
	</head>
	<body>
		<div class="item">
			<label for="weather">Weather</label>
			<select id="weather" data-setting="weather" data-default="clear">
				<option value="clear">Clear</option>
				<option value="rain">Rain</option>
				<option value="thunder">Thunder</option>
			</select>
		</div>
		<p class="hint">Needs operator rights on a server, or cheats on in singleplayer. Otherwise the key shows a lock.</p>
		<script src="pi.js"></script>
	</body>
</html>
