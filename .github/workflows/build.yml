name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-control-mod
          path: mod/build/libs/*.jar

  mod-game-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Software OpenGL and Vulkan (Mesa) on a virtual X display
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers libvulkan1
      - name: Run client game tests
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" ./gradlew runClientGameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-test-screenshots
          path: mod/build/run/**/screenshots/*.png
          if-no-files-found: ignore

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run icons -- --check
      - run: npm run pack
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-plugin
          path: plugin/dist/*.streamDeckPlugin
