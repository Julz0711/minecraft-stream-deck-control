# Temporary: prints the Minecraft 26.3 API surface this mod uses. Removed before merge.
name: API probe

on:
  push:
    branches: [claude/project-thread-bs6tar]

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew help -q || true
      - name: javap
        run: |
          JAR=$(find ~/.gradle/caches .gradle -name "minecraft-*.jar" -path "*26.3*" 2>/dev/null | grep -v sources | head -20)
          echo "$JAR"
          CP=$(echo "$JAR" | tr '\n' ':')
          FAPI=$(find ~/.gradle/caches -name "fabric-*.jar" 2>/dev/null | grep -v sources | tr '\n' ':')
          F='sed -E s/net\.minecraft\.//g;s/java\.lang\.//g;s/java\.util\.//g'
          for c in client.Options com.mojang.blaze3d.platform.Window; do
            echo "=================== $c (public methods)"
            javap -cp "$CP" "$c" | grep '(' | $F
          done
          for c in \
            client.gui.Hud \
            'client.gui.components.ChatComponent$ChatMethod' \
            client.ClientClockManager \
            world.clock.ClockNetworkState \
            world.clock.ClockManager \
            world.clock.ClockState \
            world.clock.ClockInstance \
            world.clock.WorldClocks \
            world.clock.ClockTimeMarkers \
            network.protocol.game.ClientboundGameRuleValuesPacket \
            network.protocol.game.ServerboundSetGameRulePacket \
            client.gui.screens.options.HasGamemasterPermissionReaction \
            client.gui.screens.options.InWorldGameRulesScreen \
            server.permissions.LevelBasedPermissionSet \
            server.permissions.PermissionLevel \
            world.level.GameType \
            client.sounds.SoundManager \
            client.gui.components.toasts.SystemToast\$SystemToastId \
            ; do
            echo "=================== $c"
            javap -cp "$CP" -p "net.minecraft.$c" 2>&1 | grep -vE 'lambda\$|access\$' | $F | head -150
          done
          dis() { javap -cp "$CP" -c -p "net.minecraft.$1" | awk -v m="$2" 'index($0, m"(") && /\(/ {p=1} p {print} p && /^$/ {exit}' | grep -E 'invoke|getstatic|getfield|putfield|ldc|^  [a-z]' | $F | head -${3:-120}; }
          echo "=================== Minecraft.handleGlobalKeyPress"; dis client.Minecraft handleGlobalKeyPress 200
          echo "=================== Minecraft.toggleFullscreen"; dis client.Minecraft toggleFullscreen
          echo "=================== Gui.handleKeybinds"; dis client.gui.Gui handleKeybinds 250
          echo "=================== Gui.setPauseScreen"; dis client.gui.Gui setPauseScreen
          echo "=================== ClientLevel.setTimeFromServer"; dis client.multiplayer.ClientLevel setTimeFromServer
          echo "=================== Level.getDefaultClockTime"; dis world.level.Level getDefaultClockTime
          echo "=================== ClientPacketListener.handleSetTime"; dis client.multiplayer.ClientPacketListener handleSetTime
          echo "=================== ClientPacketListener.handleGameRuleValues"; dis client.multiplayer.ClientPacketListener handleGameRuleValues
          echo "=================== Options.fov"; javap -cp "$CP" -c -p net.minecraft.client.Options | grep -E 'ldc.*"(options\.fov|soundCategory|fullscreen)' | head
