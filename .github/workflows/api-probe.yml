# Temporary: prints the Minecraft 26.3 API surface this mod uses. Removed before merge.
name: API probe

on:
  push:
    branches: [claude/project-thread-bs6tar]

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew help -q || true
      - name: javap
        run: |
          JAR=$(find ~/.gradle/caches .gradle -name "minecraft-*.jar" -path "*26.3*" 2>/dev/null | grep -v sources | head -20)
          echo "$JAR"
          CP=$(echo "$JAR" | tr '\n' ':')
          FAPI=$(find ~/.gradle/caches -name "fabric-*.jar" 2>/dev/null | grep -v sources | tr '\n' ':')
          F='sed -E s/net\.minecraft\.//g;s/java\.lang\.//g;s/java\.util\.//g'
          dis() { javap -cp "$CP" -c -p "net.minecraft.$1" | awk -v m="$2" 'index($0, m"(") && /\(/ {p=1} p {print} p && /^$/ {exit}' | grep -E 'invoke|getstatic|getfield|putfield|ldc|^  [a-z]' | $F | head -${3:-120}; }
          echo "=================== Options public"; javap -cp "$CP" net.minecraft.client.Options | grep '(' | $F
          echo "=================== MultiPlayerGameMode public"; javap -cp "$CP" net.minecraft.client.multiplayer.MultiPlayerGameMode | grep '(' | $F
          echo "=================== Minecraft public fields"; javap -cp "$CP" net.minecraft.client.Minecraft | grep -v '(' | $F
          echo "=================== Minecraft.handleKeybinds"; dis client.Minecraft handleKeybinds 400
          echo "=================== Hud.extractRenderState"; dis client.gui.Hud extractRenderState 60
          echo "=================== Gui.extractRenderState"; dis client.gui.Gui extractRenderState 80
          echo "=================== Options.getSoundSourceVolume"; javap -cp "$CP" -c -p net.minecraft.client.Options | grep -E 'ldc' | grep -iE 'fov|fullscreen|soundCategory' | head
