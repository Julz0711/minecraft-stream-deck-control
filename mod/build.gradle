plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
	mavenCentral()
}

fabricApi {
	// Client game tests live in src/gametest and are not part of the mod jar.
	// Run them with: ./gradlew runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "stream-deck-control-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// Minecraft 26.x is no longer obfuscated, so no mappings are needed.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// The local WebSocket server. `include` puts it inside the mod jar, so players install nothing extra.
	implementation "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
	include "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"

	// Optional integration. Only compiled against; not required at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Plain unit tests for the server and protocol (src/test), which have no Minecraft dependencies.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	// Minecraft 26.x requires Java 25. Gradle will download it if it isn't installed.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def archivesName = project.base.archivesName.get()
	inputs.property "archivesName", archivesName

	from("../LICENSE") {
		rename { "${it}_${archivesName}" }
	}
}
